[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btaudit"
version = "1.0.0"
description = "Statistical tools and experiments for detecting backtest overfitting"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yosef Shammout" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
]

[project.optional-dependencies]
experiments = ["matplotlib>=3.8"]
test = ["pytest>=7.4", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["btaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM"]
